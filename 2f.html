<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="cache-control" content="no-cache">
  <meta http-equiv="pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>桜間のメモ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="list" data-entry="2f">
  <main class="phone-shell">
    <header class="notes-topbar">
      <p class="back-link">フォルダ</p>
      <button id="reset-button" class="plain-button" type="button" hidden>リセット</button>
    </header>

    <section id="list-view" class="notes-list-view" aria-labelledby="page-title">
      <p class="folder-label">iCloud</p>
      <h1 id="page-title">メモ</h1>
      <div id="memo-list" class="memo-list" aria-label="桜間のメモ一覧"></div>
    </section>

    <section id="detail-view" class="memo-detail-view" hidden>
      <header class="notes-topbar detail-topbar">
        <a id="memo-back-link" class="back-link" href="#">メモ</a>
        <p class="detail-date">最近</p>
      </header>
      <article id="memo-detail" class="memo-detail" aria-live="polite"></article>
    </section>
  </main>

  <dialog id="unlock-dialog" class="unlock-dialog">
    <form id="unlock-form" method="dialog">
      <p id="unlock-title" class="dialog-title">ロックされたメモ</p>
      <p id="unlock-help" class="dialog-help">パスワードを入力してください。</p>
      <input id="password" name="password" type="text" inputmode="text" autocomplete="off" autocapitalize="off">
      <p id="error-message" class="error-message" role="status"></p>
      <div class="dialog-actions">
        <button id="cancel-button" class="dialog-button muted" type="button">キャンセル</button>
        <button class="dialog-button" type="submit">解除</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
